<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Boxes</title>
    <style>

    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #0c0b0b;
      color: #ffffff;
      padding: 20px;
    }

    /* --- BOTÃO HAMBÚRGUER --- */
    .btn-menu {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
      background: #0d0d0e;
      border: 1px solid #111010;
      color: #fff;
      width: 45px;
      height: 45px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      transition: all 0.3s ease;
    }

    .btn-menu:hover {
      background: #060607;
    }

    .btn-menu span {
      width: 22px;
      height: 2px;
      background-color: #ffffff;
      border-radius: 2px;
      transition: all 0.3s ease;
    }

    /* Animação do botão ao abrir (transforma em X) */
    .btn-menu.aberto span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }
    .btn-menu.aberto span:nth-child(2) {
      opacity: 0;
    }
    .btn-menu.aberto span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    /* --- SIDEBAR (MENU LATERAL) --- */
    .sidebar {
      position: fixed;
      top: 0;
      left: -280px; /* Oculto fora do ecrã */
      width: 280px;
      height: 100%;
      background-color: #17171b;
      border-right: 1px solid #2a2a35;
      z-index: 999;
      padding: 80px 20px 20px 20px;
      transition: left 0.3s ease;
      box-shadow: 5px 0 15px rgba(0, 0, 0, 0.5);
    }

    .sidebar.aberto {
      left: 0; /* Desliza para dentro da tela */
    }

    .sidebar h2 {
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: #ffb703;
    }

    .sidebar ul {
      list-style: none;
      margin-bottom: 25px;
    }

    .sidebar ul li {
      margin-bottom: 10px;
    }

    .sidebar ul li a {
      color: #cccccc;
      text-decoration: none;
      font-size: 1rem;
      display: block;
      padding: 10px;
      border-radius: 6px;
      transition: background 0.2s, padding-left 0.2s;
    }

    .sidebar ul li a:hover {
      background-color: #2a2a35;
      color: #ffffff;
      padding-left: 15px;
    }

    /* --- MÁSCARA ESCURA DE FUNDO --- */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      z-index: 998;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .overlay.aberto {
      opacity: 1;
      visibility: visible;
    }
  
    /* --- Fundo da página --- */
        body {
            font-family: Arial, sans-serif;
            background-color: #120f14;
            color: #fdfdfd;
            margin: 0;
            padding: 0;
        }

        .container {

            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;

        .card-jogo {
            background-color: #2c2c36;
            border-radius: 8px;
            width: 250px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(31, 29, 29, 0.3);
        }

        .card-jogo img {
            width: 100%;
            height: 300px;

            border-radius: 6px;
        }

        .preco {
            font-size: 1.2rem;

            font-weight: bold;

        }

        .btn-comprar {
            background-color: #f5c338;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        .btn-comprar:hover {
            background-color: #f5e830;
        }
    </style>
</head>

    function alternarMenu() {
      const sidebar = document.getElementById('sidebar');

      sidebar.classList.toggle('aberto');
